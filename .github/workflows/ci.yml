name: CI

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    check:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22.x, 24.x]
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
            - run: npm run check:size
            - run: npm run check:reproducible
            - name: llms.txt is up to date
              run: |
                  npm run docs:llms
                  git diff --exit-code -- llms.txt llms-full.txt
