name: Release

on:
    push:
        tags:
            - '*'

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'npm'
            # Core and engine are git dependencies recorded as git+ssh in the lockfile; CI has no SSH key.
            - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
            - run: npm ci
            - run: npm run lint
            - run: npm test
            - run: npm run build
            - run: npm run check:size

            - name: Tag matches manifest version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  version="$(node -p "require('./manifest.json').version")"
                  test "$tag" = "$version" || { echo "Tag $tag differs from manifest version $version"; exit 1; }

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      styles.css

            - name: Create draft release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  gh release create "$tag" --title="$tag" --draft main.js manifest.json styles.css
